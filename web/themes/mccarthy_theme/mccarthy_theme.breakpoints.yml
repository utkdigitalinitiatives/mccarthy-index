mccarthy_theme.mobile:
  label: mobile
  mediaQuery: "all and (min-width: 0px)"
  weight: 0
  multipliers:
    - 1x

mccarthy_theme.tablet:
  label: tablet
  mediaQuery: "all and (min-width: 768px)"
  weight: 1
  multipliers:
    - 1x

mccarthy_theme.desktop:
  label: desktop
  mediaQuery: "all and (min-width: 1024px)"
  weight: 2
  multipliers:
    - 1x
